# Scene 2 (phone): Dashboard → Profile → Connected Devices → Samsung card → Get Watch App.
appId: live.airuncoach.airuncoach
---
- runFlow: pause.yaml
- tapOn: "Profile"
- runFlow: pause.yaml
- scrollUntilVisible:
    element: "Connected Devices"
    speed: 30
- runFlow: pause.yaml
- tapOn: "Connected Devices"
- runFlow: pause.yaml
- scrollUntilVisible:
    element: "Samsung / Wear OS Watch App"
    speed: 25
- scrollUntilVisible:
    element: "Install the Ai Run Coach companion app on your Galaxy Watch4.*"
    centerElement: true
    speed: 25
- runFlow: pause.yaml
# Only the Samsung card's button is on screen once its description is centred.
- swipe:
    start: 50%, 75%
    end: 50%, 40%
    duration: 1200
- runFlow: pause.yaml
- tapOn: "Get Watch App"
- runFlow: pause.yaml
- runFlow: pause.yaml
- scrollUntilVisible:
    element: "Install on Galaxy Watch"
    speed: 25
- runFlow: pause.yaml
- runFlow: pause.yaml
